<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIDA Widget</title>
    
    <!-- AIDA Widget CSS -->
    <link rel="stylesheet" href="https://testaida.iverse.space/aida-widget.css">
  </head>
  <body>
    <!-- AIDA Widget container -->
    <div id="aida-widget-container"></div>
    
    <!-- AIDA Widget JavaScript -->
    <script src="https://testaida.iverse.space/aida-widget.umd.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        if (window.AidaWidget) {
          AidaWidget.render("#aida-widget-container", {
            language: 'en',
            user: { email: 'demo@example.com' },
            translations: {
              transcribing: 'Transcribing...',
              inputPlaceholder: 'Type a message to Aida...'
            }
          });
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
