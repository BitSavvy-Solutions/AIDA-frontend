<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIDA - Your Open AI Interface</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#202123">
  <link rel="apple-touch-icon" href="/favicon/icon-192x192.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- AIDA Widget CSS -->
  <link rel="stylesheet" href="https://testaida.iverse.space/aida-widget.css">
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!-- React App Root Container -->
  <div id="root"></div>

  <!-- AIDA Widget JavaScript -->
  <script defer src="https://testaida.iverse.space/aida-widget.umd.js"></script>

  <!-- React App Entry Script -->
  <script type="module" src="/src/index.jsx"></script>
  
  <!-- PWA Install Prompt: capture early before React mounts -->
  <script>
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__pwaPrompt = e;
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, (err) => {
          console.log('ServiceWorker registration failed: ', err);
        });
    });
  }
</script>

</body>

</html>
